# Apply in cluster-2's context. See scripts/setup-cluster.sh.
apiVersion: actions.github.com/v1alpha1
kind: RunnerDeployment
metadata:
  name: arc-runner-cluster-2
  namespace: arc-runners
spec:
  replicas: 2
  template:
    spec:
      repository: leonaltair/arc-fed          # repo-level runners for this repo
      labels:
        - cluster:cluster-2                  # targeted by runs-on in smoke.yml
