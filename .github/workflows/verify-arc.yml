name: Verify ARC

# Verifies GitHub Actions dispatches jobs to ARC runners in two k8s clusters
# (cluster-1, cluster-2), routed by the `cluster:<name>` runner label.
#
# Each cluster must expose a runner set labeled:
#   self-hosted, cluster:cluster-1   (cluster-1)
#   self-hosted, cluster:cluster-2   (cluster-2)
# See docs/arc-runner-setup.md for the matching RunnerDeployment manifests.
#
# Note: `matrix` cannot be referenced in a job-level `if` (it is evaluated
# before matrix expansion), so each cluster is a separate caller job that
# delegates to the reusable workflow in smoke.yml.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cluster:
        description: Cluster to run on
        required: false
        default: all
        type: choice
        options:
          - all
          - cluster-1
          - cluster-2

concurrency:
  group: verify-arc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cluster-1:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.cluster == 'all' || github.event.inputs.cluster == 'cluster-1' }}
    uses: ./.github/workflows/smoke.yml
    with:
      cluster: cluster-1

  cluster-2:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.cluster == 'all' || github.event.inputs.cluster == 'cluster-2' }}
    uses: ./.github/workflows/smoke.yml
    with:
      cluster: cluster-2
